[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
notes = "notes.cli:main"

[tool.setuptools.packages.find]
include = ["notes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
